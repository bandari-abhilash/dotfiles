# Place this in ~/.config/aerospace/aerospace.toml
# SketchyBar is started by `brew services`, so it isn't launched here too

# Notify SketchyBar when workspace changes
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Multi-monitor: move mouse to focused monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Apps launched from Finder get a minimal PATH; add Homebrew for both
# Apple Silicon (/opt/homebrew) and Intel (/usr/local) Macs
[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:${PATH}'

# The top gap clears the 39pt SketchyBar (with the menu bar set to auto-hide "Always").
# Notched MacBooks already reserve ~32pt for the notch, so the built-in display needs less.
# On a MacBook without a notch, set the built-in value to 47 as well.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.bottom = 0
outer.top = [{ monitor.'built-in' = 15 }, 47]
outer.right = 0
outer.left = 0



# Mode configuration
[mode.main.binding]

# --- WINDOW FOCUS (Option + hjkl) ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- WINDOW MOVE (Option + Shift + hjkl) ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- WORKSPACES (Option + 1-9) ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'

# --- MOVE WINDOW TO WORKSPACE (Option + Shift + 1-9) ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'

# --- UTILS ---
alt-slash = 'layout tiles horizontal vertical' # Toggle split orientation
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'macos-native-fullscreen'
alt-shift-space = 'layout floating tiling' # Float window
alt-shift-r = 'reload-config'
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- APP LAUNCHERS (previously skhd) ---
# Change 'Terminal' to 'Alacritty', 'iTerm', or 'Ghostty' if you use them
alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'
alt-b = 'exec-and-forget open -a "Brave Browser"'
alt-s = 'exec-and-forget open -a "Slack"'
alt-a = 'exec-and-forget open -a "Arc"'
alt-p = 'exec-and-forget open -a "Postman"'
alt-c = 'exec-and-forget open -a "Cursor"'
alt-shift-b = 'exec-and-forget sketchybar --reload'

# --- APP WORKSPACE ASSIGNMENTS ---
# [[on-window-detected]] must come AFTER all [mode.main.binding] keys
# because in TOML, [[array-of-table]] blocks absorb everything that follows

[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.postmanlabs.mac'
run = 'move-node-to-workspace 7'
